# For a Mosquitto installed on the host (not the container): `mosquitto -c docker/mosquitto/mosquitto.host.conf -v`
# Development only: anonymous access, so it listens on the loopback interface and nothing else.
# (The container's mosquitto.conf listens on every interface inside the container; compose
# publishes it on 127.0.0.1 only.)
listener 1883 127.0.0.1
allow_anonymous true
persistence false
